name: Rebuild RSS feed

on:
  push:
    paths:
      - 'content/**'
      - 'feed_generator.py'
      - 'manual_news.json'
  schedule:
    - cron: '*/15 * * * *'    # каждые 15 минут
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate RSS feed
        run: python feed_generator.py

      - name: Commit and push news.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Rebuild RSS feed [skip ci]"
          git push
